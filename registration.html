<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Вход</title>
    <link rel="stylesheet" href="registration.css">
</head>

<body>

    <div class="auth-container">

        <div class="auth-card">

            <h2>Greenhouse</h2>
            <p class="subtitle">Добро пожаловать 🌿</p>

            <div class="error-line"></div>

            <!-- USERNAME -->
            <div class="input-group">
                <label>Никнейм</label>
                <input type="text" id="userName" placeholder="Введите ник">
            </div>

            <!-- PASSWORD -->
            <div class="input-group">
                <label>Пароль</label>
                <div class="password-wrapper">
                    <input type="password" id="password" placeholder="Введите пароль">
                    <span id="togglePassword">👁️</span>
                </div>
            </div>

            <!-- REGISTER EXTRA (shown immediately on registration page) -->
            <div class="register-extra active" id="registerExtra">

                <div class="input-group">
                    <label>Электронная почта</label>
                    <input type="email" id="userEmail" placeholder="Введите email">
                </div>

                <div class="flags">
                    <span class="flag active">🇷🇺</span>
                    <span class="flag">🇬🇧</span>
                    <span class="flag">🇩🇪</span>
                </div>

            </div>

            <!-- BUTTONS -->
            <button class="login-btn">Войти</button>
            <button class="register-btn" id="registerBtn">Регистрация</button>

        </div>

    </div>

    <script src="registration.js"></script>

</body>

</html>
